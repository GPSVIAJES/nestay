<script>
const hotels = [
  {
    id: 1,
    name: "Gran Hotel Meliá Madrid",
    location: "Calle de Recoletos 4, Madrid",
    stars: 5,
    category: "Hotel · Lujo",
    score: 8.9,
    scoreLabel: "Excelente",
    priceNight: 189,
    totalStay: 567,
    amenities: ["Wifi", "Piscina", "Spa"],
    allAmenities: { wifi: true, pool: true, spa: true, restaurant: true, parking: false, gym: true, bar: true, aircon: true, petFriendly: false },
    emoji: "🏨",
    bg: "#d4c4b0",
    badge: "5 estrellas",
    bestValue: false
  },
  {
    id: 2,
    name: "NH Collection Suecia",
    location: "C. del Marqués de Casa Riera 4, Madrid",
    stars: 4,
    category: "Hotel · Superior",
    score: 8.4,
    scoreLabel: "Muy bueno",
    priceNight: 125,
    totalStay: 375,
    amenities: ["Wifi", "Restaurante", "Bar"],
    allAmenities: { wifi: true, pool: false, spa: false, restaurant: true, parking: true, gym: false, bar: true, aircon: true, petFriendly: true },
    emoji: "🏩",
    bg: "#b0c4c8",
    badge: "4 estrellas",
    bestValue: true
  },
  {
    id: 3,
    name: "Barceló Torre de Madrid",
    location: "Plaza de España 18, Madrid",
    stars: 4,
    category: "Hotel · Vistas panorámicas",
    score: 8.7,
    scoreLabel: "Excelente",
    priceNight: 145,
    totalStay: 435,
    amenities: ["Wifi", "Piscina", "Spa"],
    allAmenities: { wifi: true, pool: true, spa: true, restaurant: true, parking: false, gym: true, bar: false, aircon: true, petFriendly: false },
    emoji: "🗼",
    bg: "#c4b8d4",
    badge: "4 estrellas",
    bestValue: false
  },
  {
    id: 4,
    name: "Hotel Only YOU Boutique",
    location: "Calle del Barquillo 21, Madrid",
    stars: 4,
    category: "Hotel · Boutique",
    score: 9.1,
    scoreLabel: "Excepcional",
    priceNight: 210,
    totalStay: 630,
    amenities: ["Wifi", "Bar", "Spa"],
    allAmenities: { wifi: true, pool: false, spa: true, restaurant: true, parking: false, gym: true, bar: true, aircon: true, petFriendly: true },
    emoji: "✨",
    bg: "#c8c0b0",
    badge: "Boutique",
    bestValue: false
  }
];

const compareSet = new Set();

function renderHotels() {
  const list = document.getElementById('hotelList');
  list.innerHTML = '';
  hotels.forEach(h => {
    const isComparing = compareSet.has(h.id);
    const card = document.createElement('div');
    card.className = 'hotel-card' + (isComparing ? ' comparing' : '');
    card.id = 'card-' + h.id;
    card.innerHTML = `
      <div class="hotel-img" style="background:${h.bg}">
        <div class="img-placeholder">${h.emoji}</div>
        <div class="hotel-badge">${h.badge}</div>
      </div>
      <div class="hotel-info">
        <div class="hotel-location">
          <svg width="10" height="10" viewBox="0 0 14 14" fill="none" style="flex-shrink:0"><path d="M7 1C4.2 1 2 3.2 2 6c0 3.5 5 8 5 8s5-4.5 5-8c0-2.8-2.2-5-5-5zm0 6.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3z" fill="#e85d2f"/></svg>
          ${h.location}
        </div>
        <div class="hotel-name">${h.name}</div>
        <div class="hotel-cat">${h.category}</div>
        <div class="hotel-amenities">
          ${h.amenities.map(a => `<span class="amenity-pill">${a}</span>`).join('')}
        </div>
        <div class="hotel-bottom">
          <div class="hotel-score">
            <span class="score-badge">${h.score}</span>
            <span class="score-label">${h.scoreLabel}</span>
          </div>
          <div class="hotel-price">
            <div class="price-total">Total estancia: $${h.totalStay}</div>
            <div class="price-night">$${h.priceNight} <span>/noche</span></div>
          </div>
        </div>
      </div>
      <div class="hotel-actions">
        <button class="btn-view" onclick="alert('Ver alojamiento: ${h.name}')">Ver nido</button>
        <button class="btn-cmp ${isComparing ? 'active' : ''}" id="cmpbtn-${h.id}" onclick="toggleCompare(${h.id})">
          <span class="checkmark">${isComparing ? '✓' : '+'}</span>
          ${isComparing ? 'Comparando' : 'Comparar'}
        </button>
      </div>
    `;
    list.appendChild(card);
  });
}

function toggleCompare(id) {
  if (compareSet.has(id)) {
    compareSet.delete(id);
  } else {
    if (compareSet.size >= 3) {
      alert('Puedes comparar máximo 3 alojamientos.');
      return;
    }
    compareSet.add(id);
  }
  renderHotels();
  updateCompareBar();
}

function updateCompareBar() {
  const bar = document.getElementById('compareBar');
  const slots = document.getElementById('compareSlots');
  const btn = document.getElementById('btnCompareNow');
  if (compareSet.size === 0) {
    bar.classList.remove('visible');
    return;
  }
  bar.classList.add('visible');
  const arr = Array.from(compareSet);
  slots.innerHTML = '';
  [0,1,2].forEach(i => {
    const slot = document.createElement('div');
    if (arr[i]) {
      const h = hotels.find(x => x.id === arr[i]);
      slot.className = 'compare-slot filled';
      slot.innerHTML = `<span style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:80px">${h.name.split(' ').slice(0,2).join(' ')}</span><span class="remove-slot" onclick="toggleCompare(${arr[i]})">✕</span>`;
    } else {
      slot.className = 'compare-slot';
      slot.textContent = 'Añadir hotel...';
    }
    slots.appendChild(slot);
  });
  btn.disabled = compareSet.size < 2;
}

function openModal() {
  const arr = Array.from(compareSet).map(id => hotels.find(h => h.id === id));
  const features = [
    { label: 'Precio/noche', key: 'price' },
    { label: 'Valoración', key: 'score' },
    { label: 'Wifi gratis', key: 'wifi' },
    { label: 'Piscina', key: 'pool' },
    { label: 'Spa', key: 'spa' },
    { label: 'Restaurante', key: 'restaurant' },
    { label: 'Parking', key: 'parking' },
    { label: 'Gimnasio', key: 'gym' },
    { label: 'Bar', key: 'bar' },
    { label: 'Aire acondicionado', key: 'aircon' },
    { label: 'Acepta mascotas', key: 'petFriendly' },
  ];

  let cols = arr.map(h => `
    <th>
      ${h.bestValue ? '<div class="best-value">MEJOR VALOR</div>' : ''}
      ${h.name.split(' ').slice(0, 3).join(' ')}
      <span class="th-sub">${'★'.repeat(h.stars)} · ${h.category.split('·')[0].trim()}</span>
    </th>
  `).join('');

  let rows = features.map(f => {
    let cells = arr.map(h => {
      if (f.key === 'price') return `<td><span class="cmp-price">$${h.priceNight}</span><br><span style="font-size:10px;color:#aaa">/noche</span></td>`;
      if (f.key === 'score') return `<td><span class="cmp-score-b">${h.score}</span><br><span style="font-size:10px;color:#aaa">${h.scoreLabel}</span></td>`;
      const has = h.allAmenities[f.key];
      return `<td><span class="${has ? 'cmp-check' : 'cmp-cross'}">${has ? '✓' : '✕'}</span></td>`;
    }).join('');
    return `<tr><td>${f.label}</td>${cells}</tr>`;
  }).join('');

  document.getElementById('modalContent').innerHTML = `
    <table class="cmp-table">
      <thead><tr><th></th>${cols}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

renderHotels();
updateCompareBar();
</script>
